name: daily-scan

on:
  schedule:
    # 4x/day: 00:17, 06:17, 12:17, 18:17 UTC (4:17 PM, 10:17 PM, 4:17 AM, 10:17 AM Pacific standard time).
    # Off the top of the hour because GitHub delays or drops busy :00 schedules.
    # Each run scans back to the previous run (7-48h), so a late or skipped run leaves no gap.
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Look-back window in hours (blank = since the previous run)"
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Scan, update history, resolve, build site data
        env:
          HOURS: ${{ github.event.inputs.hours }}
        run: python3 -I polywatch.py run ${HOURS:+--hours "$HOURS"}

      - name: Commit updated data
        run: |
          git config user.name "polywatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json runs.json site/data.js
          git diff --cached --quiet || git commit -m "data: scan $(date -u '+%F %H:%M') UTC"
          git pull --rebase -q && git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      # Pages deploys occasionally fail on GitHub's side (artifact lookup); retry once after a pause.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
