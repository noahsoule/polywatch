name: daily-scan

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC = 1 AM Pacific (standard time; 2 AM during daylight time)
  workflow_dispatch:
    inputs:
      hours:
        description: "Look-back window in hours"
        default: "25"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Scan, update history, resolve, build site data
        run: python3 -I polywatch.py run --hours "${{ github.event.inputs.hours || '25' }}"

      - name: Commit updated data
        run: |
          git config user.name "polywatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json runs.json site/data.js
          git diff --cached --quiet || git commit -m "data: daily scan $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
